plugins {
    id 'com.android.application'
    id 'kotlin-android'

    // Annotation processing for Room
    id 'com.google.devtools.ksp'
}


// Update this to update the database on the next build
// This is also used to populate populate MHWDatabase.java configuration

def DATABASE_VERSION = 46

android {
    signingConfigs {
        release {
            storeFile file(GHSStoreFile)
            storePassword GHSStorePW
            keyAlias = GHSKeyAlias
            keyPassword GHSKeyPW
        }
    }
    compileSdk 36
    defaultConfig {
        applicationId "com.gatheringhallstudios.mhworlddatabase"
        minSdk 24
        targetSdk 36
        versionCode 25
        versionName "2.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // We set this to false so vectors get rastered at buildtime.
        vectorDrawables.useSupportLibrary = false

        // Import exported schemas into tests
        sourceSets {
            androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    androidResources {
        // Generates res/xml/_generated_res_locale_config.xml from the values-* folders and
        // wires it to android:localeConfig, which is what surfaces this app in the system
        // per-app language picker. The default locale comes from res/resources.properties.
        generateLocaleConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField("int", "DB_VERSION", "${DATABASE_VERSION}")

            // Debug flag usable through R.bool.DEBUG
            resValue "bool", "DEBUG", "false"

            signingConfig signingConfigs.release
        }
        debug {
            buildConfigField("int", "DB_VERSION", "${DATABASE_VERSION}")

            // Debug flag usable through R.bool.DEBUG
            resValue "bool", "DEBUG", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.gatheringhallstudios.mhworlddatabase'
    lint {
        abortOnError false
        // this application is open source, so we can't force translators to always translate.
        // disable it so we can at least fallback to english without explicit errors.
        disable 'MissingTranslation'
    }
}

// Export schemas for databases (important for testing)
ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    /*
     * AndroidX
     */
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    /*
     * Testing
     */
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"

    /*
     * Flexbox layout
     */
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    /*
     * Leak Canary
     * https://github.com/square/leakcanary
     */
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    /*
     * Android Kotlin Extensions
     */
    implementation "androidx.core:core-ktx:1.17.0"

    /*
     * Android Architecture Components
     */
    def lifecycle_version = "2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // Pinned to 2.6.x: the app supplies its own SupportSQLiteOpenHelper
    // (util/sqliteloader) that never invokes Room's Configuration.callback, so Room 2.7's
    // rewritten invalidation tracker never gets to create room_table_modification_log and
    // every LiveData query crashes. See the note in MHWDatabase.getDatabase.
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"

    /*
     * Android Navigation Component
     */
    def nav_version = "2.8.9"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    /*
     * Adapter Delegates
     * https://github.com/sockeqwe/AdapterDelegates
     */
    implementation 'com.hannesdorfmann:adapterdelegates4:4.3.2'

    /*
     * Groupie
     * https://github.com/lisawray/groupie
     */
    implementation 'com.github.lisawray.groupie:groupie:2.10.1'
    implementation 'com.github.lisawray.groupie:groupie-viewbinding:2.10.1'

    /*
     * VectorMaster
     * https://github.com/harjot-oberai/VectorMaster
     */
    // Pulls in appcompat-v7 25.3.0, which now clashes with AndroidX. Its own bytecode
    // references nothing from the support library, so the transitive dependency is dropped.
    implementation('com.github.harjot-oberai:VectorMaster:357124ddde') {
        exclude group: 'com.android.support'
    }

    /*
    Change log extension
     */
    implementation 'com.github.MFlisar:changelog:1.1.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'

    /*
    View pager extension
     */
    implementation 'com.tbuonomo:dotsindicator:4.3'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
}

apply plugin: 'de.undercouch.download'

/**
 * Download the database every time the app is assembled if it hasn't been done already.
 */
gradle.projectsEvaluated {
    preBuild.dependsOn('downloadDatabase')
}

tasks.register('downloadDatabase', de.undercouch.gradle.tasks.download.Download) {
    src "https://github.com/gatheringhallstudios/MHWorldData/releases/download/V${DATABASE_VERSION}/mhw.db"
    dest "src/main/assets/databases/mhw.db"
    overwrite true
    onlyIfModified true
}
