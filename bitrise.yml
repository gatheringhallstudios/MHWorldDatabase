format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android

app:
  envs:
  - PROJECT_LOCATION: .
  - PACKAGE_NAME: com.gatheringhallstudios.mhworlddatabase
  - KEYSTORE_PATH: $HOME/keystores/release.jks
  - RELEASE_NOTES_DIR: fastlane/metadata/android/en-US/changelogs

trigger_map:
- push_branch: master
  workflow: test
- pull_request_source_branch: "*"
  workflow: test

workflows:
  _setup:
    summary: Clone, pick JDK 17 and restore the Gradle cache. Shared by every workflow.
    steps:
    - git-clone@8:
        run_if: .IsCI
    - set-java-version@1:
        run_if: .IsCI
        inputs:
        - set_java_version: "17"
    - restore-gradle-cache@3:
        run_if: .IsCI

  test:
    summary: Lint and unit tests. Replaces the fastlane `test` lane and the CircleCI job.
    before_run:
    - _setup
    steps:
    - android-lint@0:
        inputs:
        - project_location: $PROJECT_LOCATION
    - android-unit-test@1:
        inputs:
        - project_location: $PROJECT_LOCATION
    - save-gradle-cache@1:
        run_if: .IsCI
    - deploy-to-bitrise-io@2:
        run_if: .IsCI

  bundle_release:
    summary: Build the signed release AAB. Replaces the fastlane `bundle_release` lane.
    description: |-
      Needs the release keystore uploaded under App settings > Code signing > Android keystore
      file. That exposes BITRISEIO_ANDROID_KEYSTORE_URL, _PASSWORD, _ALIAS and
      _PRIVATE_KEY_PASSWORD, which are mapped onto the Gradle signing properties below. These
      ORG_GRADLE_PROJECT_* env vars override the dummy GHS* values in gradle.properties.
    envs:
    - ORG_GRADLE_PROJECT_GHSStoreFile: $KEYSTORE_PATH
    - ORG_GRADLE_PROJECT_GHSStorePW: $BITRISEIO_ANDROID_KEYSTORE_PASSWORD
    - ORG_GRADLE_PROJECT_GHSKeyAlias: $BITRISEIO_ANDROID_KEYSTORE_ALIAS
    - ORG_GRADLE_PROJECT_GHSKeyPW: $BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD
    before_run:
    - _setup
    steps:
    - file-downloader@2:
        title: Download release keystore
        inputs:
        - source: $BITRISEIO_ANDROID_KEYSTORE_URL
        - destination: $KEYSTORE_PATH
        - use_sudo: "false"
    - android-build@1:
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: app
        - variant: release
        - build_type: aab
    - save-gradle-cache@1:
        run_if: .IsCI
    - deploy-to-bitrise-io@2:
        run_if: .IsCI

  deploy_beta:
    summary: Build the signed AAB and publish it to the Play Store beta track. Replaces the
      fastlane `deploy_beta` lane.
    description: |-
      Needs the Play Console service account JSON uploaded under App settings > Code signing >
      Generic file storage with the ID SERVICE_ACCOUNT_JSON_KEY.

      Release notes come from $RELEASE_NOTES_DIR/<versionCode>.txt, same as the old fastlane
      layout. Set dry_run to true on the Google Play Deploy step to validate without
      publishing.
    before_run:
    - bundle_release
    steps:
    - script@1:
        title: Prepare Play Store release notes
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            version_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
            notes="$RELEASE_NOTES_DIR/$version_code.txt"
            if [ ! -f "$notes" ]; then
              echo "Missing release notes: $notes" >&2
              exit 1
            fi

            whatsnew_dir="$BITRISE_DEPLOY_DIR/whatsnew"
            mkdir -p "$whatsnew_dir"
            cp "$notes" "$whatsnew_dir/whatsnew-en-US"
            envman add --key WHATSNEW_DIR --value "$whatsnew_dir"
    - google-play-deploy@4:
        inputs:
        - service_account_json_key_path: $BITRISEIO_SERVICE_ACCOUNT_JSON_KEY_URL
        - package_name: $PACKAGE_NAME
        - app_path: $BITRISE_AAB_PATH
        - track: beta
        - status: completed
        - whatsnews_dir: $WHATSNEW_DIR
        - dry_run: "false"