format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android

app:
  envs:
  - PROJECT_LOCATION: .
  - KEYSTORE_PATH: $HOME/keystores/release.jks

trigger_map:
- push_branch: master
  workflow: main
- pull_request_source_branch: "*"
  workflow: pr_check
- tag: v*
  workflow: release

workflows:
  _setup:
    summary: Clone, pick JDK 17 and restore the Gradle cache. Shared by every workflow.
    steps:
    - git-clone@8:
        run_if: .IsCI
    - set-java-version@1:
        run_if: .IsCI
        inputs:
        - set_java_version: "17"
    - restore-gradle-cache@3:
        run_if: .IsCI

  pr_check:
    summary: Lint, unit tests and a debug build. Runs on every pull request.
    before_run:
    - _setup
    steps:
    - android-lint@0:
        inputs:
        - project_location: $PROJECT_LOCATION
    - android-unit-test@1:
        inputs:
        - project_location: $PROJECT_LOCATION
    - android-build@1:
        title: Build debug APK
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: app
        - variant: debug
        - build_type: apk
    - deploy-to-bitrise-io@2:
        run_if: .IsCI

  main:
    summary: Same checks as pr_check on every push to master, then saves the Gradle cache.
    description: |-
      Only master saves the Gradle cache, so pull requests read a cache built from master
      and never overwrite it. The debug APK from pr_check is on the build page for testers.
    before_run:
    - pr_check
    steps:
    - save-gradle-cache@1:
        run_if: .IsCI

  device_tests:
    summary: Instrumented tests (Room migrations and DAO tests) on Firebase Test Lab.
    description: |-
      Runs app/src/androidTest through Bitrise Virtual Device Testing. Enable the Virtual
      Device Testing add-on for this app first; it provides ADDON_VDTESTING_API_TOKEN.

      Meant to run nightly: add a schedule for this workflow under Builds > Schedule.
    before_run:
    - _setup
    steps:
    - android-build-for-ui-testing@0:
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: app
        - variant: debug
    - virtual-device-testing-for-android@1:
        inputs:
        - test_type: instrumentation
        - test_devices: MediumPhone.arm,33,en,portrait
    - deploy-to-bitrise-io@2:
        run_if: .IsCI

  release:
    summary: Signed release AAB for Release Management. Runs on v* tags.
    description: |-
      Checks that the tag, app/build.gradle and changelog.xml agree, then builds the signed
      AAB and APK and uploads them to bitrise.io. Release Management picks up the AAB for Play;
      the APK is for installing the release build directly on a device.

      Needs the release keystore uploaded under App settings > Code signing > Android keystore
      file. That exposes BITRISEIO_ANDROID_KEYSTORE_URL, _PASSWORD, _ALIAS and
      _PRIVATE_KEY_PASSWORD, which are mapped onto the Gradle signing properties below. These
      ORG_GRADLE_PROJECT_* env vars override the dummy GHS* values in gradle.properties.
    envs:
    - ORG_GRADLE_PROJECT_GHSStoreFile: $KEYSTORE_PATH
    - ORG_GRADLE_PROJECT_GHSStorePW: $BITRISEIO_ANDROID_KEYSTORE_PASSWORD
    - ORG_GRADLE_PROJECT_GHSKeyAlias: $BITRISEIO_ANDROID_KEYSTORE_ALIAS
    - ORG_GRADLE_PROJECT_GHSKeyPW: $BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD
    before_run:
    - _setup
    steps:
    - script@1:
        title: Check release versions
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            version_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
            version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -1)
            echo "app/build.gradle: versionCode $version_code, versionName $version_name"

            failed=0

            tag="${BITRISE_GIT_TAG:-}"
            if [ -n "$tag" ] && [[ "$tag" != "v$version_name" && "$tag" != "v$version_name-"* ]]; then
              echo "Tag $tag does not match versionName $version_name (expected v$version_name)" >&2
              failed=1
            fi

            changelog=app/src/main/res/raw/changelog.xml
            latest_code=$(sed -nE 's/.*versionCode="([0-9]+)".*/\1/p' "$changelog" | head -1)
            latest_name=$(sed -nE 's/.*versionName="Version ([^"]+)".*/\1/p' "$changelog" | head -1)
            if [ "$latest_code" != "$version_code" ] || [ "$latest_name" != "$version_name" ]; then
              echo "$changelog: newest entry is $latest_code / $latest_name, expected $version_code / $version_name" >&2
              failed=1
            fi

            exit $failed
    - file-downloader@2:
        title: Download release keystore
        inputs:
        - source: $BITRISEIO_ANDROID_KEYSTORE_URL
        - destination: $KEYSTORE_PATH
        - use_sudo: "false"
    - android-build@1:
        title: Build release AAB
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: app
        - variant: release
        - build_type: aab
    - android-build@1:
        title: Build release APK
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: app
        - variant: release
        - build_type: apk
    - deploy-to-bitrise-io@2:
        run_if: .IsCI
